<!DOCTYPE html>

<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* Стили для идеальной типографики */
    .article-header { max-width: 900px; margin: 80px auto 48px; padding: 0 24px; text-align: center; }
    .article-meta { display: flex; justify-content: center; gap: 16px; font-size: 14px; color: var(--ink-3); margin-bottom: 24px; font-weight: 500; }
    .article-title { font-size: clamp(36px, 5vw, 64px); margin-bottom: 24px; line-height: 1.1; letter-spacing: -0.03em; }
    
    .article-cover { max-width: 1200px; margin: 0 auto 64px; height: 450px; border-radius: var(--radius-xl); display: flex; align-items: center; justify-content: center; }
    .article-cover svg { width: 100px; height: 100px; opacity: 0.4; }
    .cover-indigo { background: var(--primary-soft); color: var(--primary); }
    .cover-emerald { background: var(--primary-soft); color: var(--primary); }
    .cover-amber { background: var(--accent-soft); color: var(--accent); }
    .cover-violet { background: var(--bg-subtle); color: var(--ink-2); }
    
    .article-content { max-width: 760px; margin: 0 auto; padding: 0 24px 96px; font-size: 19px; line-height: 1.8; color: var(--ink-2); }
    .article-content p { margin-bottom: 32px; }
    .article-content h2 { font-size: 32px; margin: 56px 0 24px; color: var(--ink); letter-spacing: -0.02em; }
    .article-content h3 { font-size: 24px; margin: 40px 0 16px; color: var(--ink); }
    .article-content ul, .article-content ol { margin-bottom: 32px; padding-left: 24px; }
    .article-content li { margin-bottom: 16px; }
    .article-content blockquote { border-left: 4px solid var(--primary); padding: 24px 32px; margin: 48px 0; background: var(--bg-subtle); border-radius: 0 20px 20px 0; font-style: italic; color: var(--ink); font-size: 22px; font-weight: 500; }
    
    @media (max-width: 768px) {
      .article-cover { height: 250px; border-radius: var(--radius-lg); margin-bottom: 40px; }
      .article-title { font-size: 32px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <img src="logo.png" alt="ArturExpert" class="brand-logo">
      </a>
      <nav class="main-nav">

      </nav>
      <a href="calculations.html" class="btn btn-primary btn-sm header-cta">Открыть калькулятор</a>
    </div>
  </header>

  <article id="article-container">
    <div style="text-align: center; padding: 120px 20px; color: var(--ink-3);">
      Загрузка статьи...
    </div>
  </article>

  <footer class="site-footer" style="margin-top: 0;">
    <div class="footer-inner">
      <div class="footer-brand">
        Artur<b style="color:var(--primary)">Expert</b>
      </div>
      <div class="footer-note">© 2026 ArturExpert</div>
    </div>
  </footer>

  <script src="assets/js/articles.js"></script>
</body>
</html>
